name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  authentication-postgres:
    name: PostgreSQL authentication across replicas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: partylayer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d partylayer_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @partylayer/core build
      - run: pnpm --filter partylayer-authentication-server-example test:postgres
        env:
          PARTYLAYER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/partylayer_test

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check workspace protocols
        run: pnpm run lint:workspace-protocol

      - name: Build (workspace @partylayer/* only)
        # Scoped to @partylayer/* during recovery waves so a transiently
        # broken npm-published consumer (e.g. wallet-balance-loop pulling
        # a borked transitive @partylayer/*) cannot block a recovery PR's
        # CI. Full-tree build runs in .github/workflows/examples.yml on
        # schedule and on-demand.
        #
        # --workspace-concurrency=1 (serial) is REQUIRED, not tidiness: tsup uses
        # `clean: true`, so a parallel build can wipe/rewrite a workspace dep's
        # dist while a dependent's DTS reads it (intermittent "Could not find a
        # declaration file" race) — same precedent as examples.yml. Serial
        # enforces topological order deterministically.
        run: pnpm -r --filter "@partylayer/*" --workspace-concurrency=1 build

      - name: Validate publish coherence
        run: pnpm validate:publish

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify Registry Signatures
        run: |
          # Verify stable registry
          if [ -f registry/v1/stable/registry.sig ] && [ -f registry/keys/dev.pub ]; then
            pnpm registry:verify --channel stable --pubkey registry/keys/dev.pub || exit 1
          fi
          
          # Verify beta registry
          if [ -f registry/v1/beta/registry.sig ] && [ -f registry/keys/dev.pub ]; then
            pnpm registry:verify --channel beta --pubkey registry/keys/dev.pub || exit 1
          fi

      - name: Install Playwright Browsers
        run: |
          cd apps/demo
          pnpm exec playwright install --with-deps chromium

      - name: Run Full Verification Pipeline
        run: |
          pnpm verify:e2e
        env:
          CI: true
          
      - name: Upload Verification Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-artifacts
          path: |
            artifacts/verify/**/*
            apps/demo/playwright-report/**
            apps/demo/test-results/**
          if-no-files-found: ignore
          retention-days: 30
