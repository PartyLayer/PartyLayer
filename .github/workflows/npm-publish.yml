name: Owner-approved npm publishing

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Comma-separated existing package names to prepare'
        required: true
        default: 'create-partylayer-app'
        type: string
      tag:
        description: 'Dist-tag applied only after owner approval on GitHub'
        required: true
        default: latest
        type: choice
        options: [latest, next]
      publish:
        description: 'Publish the exact validated files after the owner approves this run on GitHub'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: owner-approved-npm-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository_id == '1142218754' &&
      github.actor_id == '70052819' &&
      github.triggering_actor == 'anilkaracay' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      security-events: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Verify owner, current main, successful CI and release environment
        run: node scripts/release/owner-publish.mjs preflight
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '9.15.9'
      - run: pnpm install --frozen-lockfile
      - name: Build the reviewed source and verify actual packed consumers
        run: |
          pnpm build
          pnpm validate:publish
          pnpm gate:package-contents
          pnpm verify:packed-wallets
      - name: Prepare immutable pnpm tarballs and a release manifest
        run: node scripts/release/owner-approved.mjs prepare "$RUNNER_TEMP/npm-release"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PACKAGES: ${{ inputs.packages }}
          RELEASE_TAG: ${{ inputs.tag }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: prepare
    if: >-
      inputs.publish == true &&
      github.repository_id == '1142218754' &&
      github.actor_id == '70052819' &&
      github.triggering_actor == 'anilkaracay' &&
      github.ref == 'refs/heads/main'
    environment:
      name: npm-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Install only the pinned official npm CLI
        run: npm install --global npm@11.19.0 --ignore-scripts --registry=https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-release/
      - name: Verify exact artifacts and publish after owner approval
        run: node scripts/release/owner-publish.mjs publish "$RUNNER_TEMP/npm-release"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PACKAGES: ${{ inputs.packages }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-release-user.npmrc
          NPM_CONFIG_GLOBALCONFIG: ${{ runner.temp }}/npm-release-global.npmrc
      - name: Preserve partial receipts even if publishing stops
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-publish-receipt-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-release/publish-receipt.json
          if-no-files-found: ignore
          retention-days: 30
