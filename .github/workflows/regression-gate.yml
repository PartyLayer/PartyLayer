name: Regression Safety Gate

# Mechanical regression net for PartyLayer. Runs the single `pnpm gate`
# command, which is the source of truth for "is everything still safe":
#   typecheck → lint → build (@partylayer/*) → unit tests → CIP-0103
#   native-path conformance → public-API snapshot diff → registry integrity.
#
# Any drift in the public API of a published package, any broken adapter or
# conformance test, or a dropped cip0103 flag in the registry fails this
# check. Intended to be a REQUIRED status check via branch protection on
# main (configure in GitHub repo settings).

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - chore/regression-safety-gate

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: regression-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: pnpm gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        # fetch-depth: 0 fetches full history AND all tags. gate:release-changeset
        # compares each publishable package against its `<name>@<version>` release
        # tag, so the tags must be present; the default shallow checkout has none.
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version is read from the root package.json `packageManager` field.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The gate's final stage (gate:verify-e2e) runs the mock E2E and security
      # suites, which need a real browser. ci.yml has always installed chromium
      # before its own verify:e2e step; this job did not, because until the gate
      # gained that stage it had no browser-dependent work. Without this the two
      # suites skip, the gate still passes, and the coverage silently disappears
      # from every pull request.
      - name: Install Playwright Chromium
        run: pnpm --filter partylayer-demo exec playwright install --with-deps chromium

      - name: Run regression safety gate
        run: pnpm gate

      # `pnpm gate` uploads nothing on its own, so a failure used to leave only
      # the console. The log now names each failing test, and this keeps the full
      # report for the cases where the first line is not enough.
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-gate-verify-report
          path: artifacts/verify/**/*
          if-no-files-found: ignore
          retention-days: 30
